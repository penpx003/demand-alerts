# Render Blueprint — deploy the Demand Planning digest as a free web service.
# In Render: New + -> Blueprint -> connect this repo. Then set the `sync: false`
# secrets in the dashboard (they are NOT stored in git).
#
# This is a SEPARATE service from the RAG bot: its own URL, its own env vars, its
# own Teams channel. Do not reuse the RAG service's DEMAND_* or token values.
services:
  - type: web
    # Must match the existing service name, or a Blueprint deploy creates a
    # second service instead of updating the live one.
    name: demand-alerts
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Groq retires ids without notice; check /v1/models if this 404s.
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: DEMAND_TREND_WEEKS
        value: "8"
      - key: DEMAND_SNAPSHOT_PC_LIMIT
        value: "500"
      - key: DEMAND_TOP_N
        value: "8"
      # Link appended to the digest so planners can open the detail. Not secret,
      # but set it in the dashboard if you would rather not commit the site path.
      - key: WORKBOOK_URL
        sync: false
      # Secrets — set these in the Render dashboard (sync: false = not in repo):
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DEMAND_DIGEST_TOKEN
        sync: false
